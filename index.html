<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Dekpboy | Medical Mastery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel&family=Inter:wght@200;400&display=swap');
        body { background: #050505; color: #D4AF37; font-family: 'Inter', sans-serif; }
        .lux-card { background: #0a0a0a; border: 1px solid #222; transition: 0.3s; }
        .lux-card:hover { border-color: #D4AF37; cursor: pointer; }
    </style>
</head>
<body class="p-8">
    <h1 class="text-4xl text-center font-['Cinzel'] mb-12">DEKPBOY: MEDICAL ROADMAP</h1>

    <div id="app" class="max-w-4xl mx-auto grid md:grid-cols-2 gap-6">
        <!-- ตัวอย่างการ์ดวิชา -->
        <div class="lux-card p-6" onclick="openDetails('Mathematics')">
            <h2 class="text-xl uppercase tracking-widest">Mathematics</h2>
            <p class="text-xs opacity-50 mt-2">คลิกเพื่อดูเนื้อหาลึก 10 บท</p>
        </div>
        
        <div class="lux-card p-6" onclick="openDetails('Physics')">
            <h2 class="text-xl uppercase tracking-widest">Physics</h2>
            <p class="text-xs opacity-50 mt-2">คลิกเพื่อดูเนื้อหาลึก 10 บท</p>
        </div>
    </div>

    <!-- Modal รายละเอียด -->
    <div id="modal" class="hidden fixed inset-0 bg-black/90 p-10 overflow-y-auto">
        <button onclick="document.getElementById('modal').classList.add('hidden')" class="mb-10 text-[#D4AF37]">✕ ปิด</button>
        <div id="modal-content" class="max-w-2xl mx-auto"></div>
    </div>

    <script>
        const curriculum = {
            'Mathematics': ['เซต', 'ตรรกศาสตร์', 'จำนวนจริง', 'ความสัมพันธ์และฟังก์ชัน', 'เรขาคณิตวิเคราะห์'],
            'Physics': ['กลศาสตร์', 'สมดุลกล', 'งานและพลังงาน', 'โมเมนตัม', 'การเคลื่อนที่แบบวงกลม']
        };

        function openDetails(subject) {
            const content = document.getElementById('modal-content');
            content.innerHTML = `<h2 class="text-3xl mb-6">${subject}</h2>` + 
                curriculum[subject].map(item => `
                    <div class="flex justify-between items-center p-4 border-b border-[#222]">
                        <span>${item}</span>
                        <button onclick="alert('ติ๊กถูกเพื่อปลูกต้นไม้')" class="text-xs border border-[#D4AF37] px-2 py-1">ทำจบแล้ว</button>
                    </div>
                `).join('');
            document.getElementById('modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
